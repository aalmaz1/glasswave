apply plugin: 'com.android.application'

// GitHub Actions sets these values. Keep local builds usable when they are absent.
def ciVersionCode = System.getenv('VERSION_CODE')?.trim()
def ciVersionName = System.getenv('VERSION_NAME')?.trim()
def appVersionCode = ciVersionCode ? Integer.parseInt(ciVersionCode) : 1
def appVersionName = ciVersionName ?: '1.0.0'

// Release signing: CI decodes a keystore from the ANDROID_KEYSTORE_BASE64
// secret and exposes KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS /
// KEY_PASSWORD. Without them we keep the debug fallback so local builds stay
// installable — but debug-signed APKs cannot be updated across CI builds,
// because every runner generates a fresh debug key.
def releaseKeystorePath = System.getenv('KEYSTORE_FILE')?.trim()
def hasReleaseKeystore = releaseKeystorePath != null
        && !releaseKeystorePath.isEmpty()
        && file(releaseKeystorePath).exists()

android {
    namespace = "com.glasswave.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.glasswave.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI supplies an increasing build number for every automatic GitHub Release.
        // Local builds keep stable fallback values.
        versionCode = appVersionCode
        versionName = appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The app only ships these languages (see src/i18n). Stripping the
        // remaining ~80 appcompat translations saves a few hundred KB with no
        // functional loss — untranslated locales simply fall back to default.
        resConfigs "en", "ru", "ko"
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8 code shrinking/obfuscation + resource shrinking. Capacitor and
            // its plugins ship consumer ProGuard rules, and the reflection-based
            // pieces (plugins offered to JS, the notification sound resolved via
            // Resources.getIdentifier) are protected in proguard-rules.pro and
            // res/values/keep.xml, so this is function-loss-free — but noticeably
            // smaller and faster (stripped dex, dead code removed).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('KEYSTORE_* environment variables are not configured — release APK will be debug-signed.')
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
