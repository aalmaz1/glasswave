name: glasswave
description: "GlassWave — glassmorphism notes app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  lucide_icons_flutter: ^4.0.1
  google_fonts: ^8.1.0
  easy_localization: ^3.0.8
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
