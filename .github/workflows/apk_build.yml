name: Build and release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # Gate the release on the compiler so broken TS never ships as an APK.
        run: npm run typecheck

      - name: Decode release keystore (if configured)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/glasswave-release.keystore"
          else
            echo "No signing secrets — release APK will be debug-signed."
          fi

      - name: Build web app and sync Capacitor
        run: npm run cap:sync

      - name: Build release APK
        working-directory: android-capacitor
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/glasswave-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp android-capacitor/app/build/outputs/apk/release/app-release.apk \
            "GlassWave-${VERSION_NAME}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: GlassWave-${{ env.VERSION_NAME }}
          path: GlassWave-${{ env.VERSION_NAME }}.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" \
            "GlassWave-${VERSION_NAME}.apk" \
            --target "${GITHUB_SHA}" \
            --title "GlassWave v${VERSION_NAME}" \
            --generate-notes \
            --latest
